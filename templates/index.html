<!DOCTYPE html>
<html>
<head>
    <title>SMS Fraud Detection</title>
    <link rel="stylesheet" type="text/css"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container">
    <h2>📩 SMS Fraud Detection</h2>

    <form method="POST">
        <textarea name="sms" placeholder="SMS লিখুন...">{{ sms }}</textarea><br>
        <button type="submit">Check</button>
    </form>

    {% if result %}
        <h3>
            Result:
            <span class="{{ 'fraud' if result == 'Fraud' else 'legit' }}">
                {{ result }}
            </span>
        </h3>

        {% if confidence is not none %}
            <p class="confidence">
                Confidence: {{ confidence|round(2) }}%
            </p>
        {% endif %}
    {% endif %}
</div>
</body>
</html>
